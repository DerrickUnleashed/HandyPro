<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Service</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <div class="container mt-5 animate__animated animate__fadeInUp">
        <h1>Add Service</h1>
        <form method="POST" action="/Add_Service.html">
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="serviceName" class="form-label">Service Name:</label>
                <input type="text" class="form-control" id="serviceName" name="serviceName" placeholder="Enter service name">
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="description" class="form-label">Description:</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="basePrice" class="form-label">Base Price:</label>
                <input type="number" class="form-control" id="basePrice" name="basePrice" placeholder="Enter base price">
            </div>
            <button type="submit" class="btn btn-primary animate__animated animate__fadeInUp">Submit</button>
        </form>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
