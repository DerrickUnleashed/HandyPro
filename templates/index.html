<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandyPro</title>
    <link rel="icon" type="image/png" href="../static/favicon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script>
        if (window !== window.top) {
            window.top.location.href = window.location.href;
        }
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('static/4.jpg');
            background-size: cover; 
            background-repeat: no-repeat; 
            color: black;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .navbar {
            background-color: black;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: bold;
            color: white;
        }
        .hero {
            background: linear-gradient(135deg, orange 25%, black 100%);
            color: black;
            padding: 100px 0;
        }
        .hero h1 {
            font-size: 3.5rem;
            font-weight: bold;
        }
        .feature-icon {
            font-size: 3rem;
            color: black;
        }
        .cta-section {
            background-color: black;
            color: black;
        }
        .footer {
            background-image: url('static/4.jpg');
            background-size: cover; 
            background-repeat: no-repeat; 
            color: black;
            text-align: center;
        }
        .btn-primary {
            background-color: black;
            border-color: black;
        }
        .btn-outline-primary {
            color: black;
            border-color: black;
        }
        .btn-light {
            background-color: black;
            color: black;
        }
        .btn-outline-light {
            color: black;
            border-color: black;
        }
        #features .col-md-6 > div { 
            animation: fadeIn 3s ease-in-out infinite; 
            animation-fill-mode: forwards;
        }
        #features .col-md-6:nth-child(2) > div { 
            animation-delay: 0s;
        }
        @keyframes fadeIn {
            from { opacity: 0.25; }
            to { opacity: 1; }
        }
        .container {
            animation: fadeIn 1s ease-in-out;
        }
        .button_gap {
            margin-left: 2%;
            margin-right: 2%;
            padding: 2px;
        }
        .heading {
            font-size: 40px;
            font-family: "Special Elite", system-ui;
            font-weight: 400;
            font-style: normal;
        }
        .ul_list_size {
            width: 70%;
            margin-left: 0%;
        }
        .button_design {
            font-size: 80%;
            color: white;
            border-color: white;
        }
        .iframe_dim {
            margin-top: 0.5%;
            width: 100%;
            display: flex;
            flex-direction: column; 
            background-color: black; 
            overflow: hidden;
            flex: 1; /* Ensures it takes available space */
        }
        .second-iframe { 
            flex-grow: 1; 
            border: none; 
            margin: 0; 
            padding: 0;
            width: 100%; 
        }
        .nav_frame {
            border: none; 
            margin: 0; 
            padding: 0;            
            height: 8vh; 
            width: 100%; 
        }
        .nav_dim {
            background-color: black; 
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="nav_dim">
        <iframe src="{{ navbar }}" name="iFrameOnIndexPage" title="homepage" class="nav_frame" scrolling="no"></iframe>
    </div>

    <div class="iframe_dim">
        <iframe src="{{ iframeSrc }}" name="iFrameOnIndexPage" title="homepage" class="second-iframe" scrolling="no"></iframe>
    </div>

    <!-- Footer -->
    <footer class="footer py-4 animate__animated animate__fadeInUp">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>HandyPro</h5>
                    <p>Your go-to platform for reliable home services.</p>
                </div>
                <div class="col-md-3">
                    <h5>Quick Links</h5>
                    <ul class="list-unstyled">
                        <li><a href="about">About Us</a></li>
                        <li><a href="faq">FAQ</a></li>
                        <li><a href="privacyPolicy">Privacy Policy</a></li>
                        <li><a href="toc">Terms of Service</a></li>
                    </ul>
                </div>
                <div class="col-md-3">
                    <h5>Connect With Us</h5>
                    <ul class="list-inline">
                        <li class="list-inline-item"><a href="https://www.facebook.com/" target="_blank"><i class="fab fa-facebook"></i></a></li>
                        <li class="list-inline-item"><a href="https://x.com/" target="_blank"><i class="fab fa-twitter"></i></a></li>
                        <li class="list-inline-item"><a href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a></li>
                        <li class="list-inline-item"><a href="https://www.linkedin.com/in/derrick-s-richard/" target="_blank"><i class="fab fa-linkedin"></i></a></li>
                    </ul>
                </div>
            </div>
            <hr>
            <div class="text-center">
                <p>&copy; 2024 HandyPro. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        function resizeIframe() {
            const iframe = document.querySelector('.second-iframe');
            try {
                iframe.style.height = iframe.contentWindow.document.body.scrollHeight + 'px';
            } catch (error) {
                console.error("Error resizing iframe:", error);
            }
        }

        // Add event listener to adjust iframe height on load
        document.querySelector('.second-iframe').addEventListener('load', resizeIframe);

        document.getElementById('learnMoreButton').addEventListener('click', function(event) {
            event.preventDefault(); 
            const target = document.getElementById('features'); 
            target.scrollIntoView({ behavior: 'smooth' }); 
        });
    </script>
</body>
</html>
