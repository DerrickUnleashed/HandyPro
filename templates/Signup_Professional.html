<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Signup</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('static/4.jpg'); /* Corrected background image path */
            background-size: cover; 
            background-repeat: no-repeat; 
            color: black;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            background-color: orange;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: bold;
            color: black;
        }
        .footer {
            background-color: orange;
            color: black;
        }
        .btn-primary{
            background-color: orange;
            border-color: black;
        }
        .container {
            animation: fadeIn 1s ease-in-out;
            flex: 1;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container mt-5 animate__animated animate__fadeInUp">
        <h1>Professional Signup</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="name" class="form-label">Full Name:</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name">
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="email" class="form-label">Email address:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="experience" class="form-label">Experience:</label>
                <input type="text" class="form-control" id="experience" name="experience" placeholder="Enter your experience">
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="skills" class="form-label">Skills:</label>
                <textarea class="form-control" id="skills" name="skills" rows="3" placeholder="Enter your skills"></textarea>
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="address" class="form-label">Address:</label>
                <input type="text" class="form-control" id="address" name="address" placeholder="Enter your address">
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="certification" class="form-label">Certification File:</label>
                <input type="file" class="form-control" id="certification" name="certification">
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="postalCode" class="form-label">Postal Code:</label>
                <input type="text" class="form-control" id="postalCode" name="postalCode" placeholder="Enter your postal code">
            </div>
            <div class="mb-3 animate__animated animate__fadeInUp">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary animate__animated animate__fadeInUp">Submit</button>
        </form>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
