<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Summary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('static/3.jpg'); /* Corrected background image path */
            background-size: cover; 
            background-repeat: no-repeat; 
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        .footer {
            background-color: orange;
            color: black;
            flex-shrink: 0; /* Prevent footer from shrinking */
        }
        .navbar {
            background-color: orange;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: bold;
            color: black;
        }
        .main-content {
            flex-grow: 1; /* Allow main content to grow */
        }
        .container {
            animation: fadeIn 1s ease-in-out;
            flex: 1;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .chart-container {
            width: 50%; /* Adjust width as needed */
            margin: 0 auto; /* Center the chart */
        }
    </style>
</head>
<body>
    <div class="container mt-5 main-content animate__animated animate__fadeInUp">
        <h1>Professional Summary</h1>
        <div class="chart-container">
            <h2>Service Requests</h2>
            <canvas id="serviceRequestsChart"></canvas>
        </div>
        <div class="chart-container">
            <h2>Ratings</h2>
            <canvas id="ratingsChart"></canvas>
        </div>
        <div class="chart-container">
            <h2>Rating Over Time</h2>
            <canvas id="ratingOverTimeChart"></canvas>
        </div>
        <script>
            const serviceRequestsData = {
                labels: ['Requested', 'Accepted', 'Closed'],
                datasets: [{
                    label: 'Service Requests',
                    data: [8, 5, 3], 
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 206, 86, 0.6)'
                    ],
                borderColor: [
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)'
                ],
                borderWidth: 2
                }]
            };

            const ratingsData = {
                labels: ['1', '2', '3', '4', '5'],
                datasets: [{
                    label: 'Rating Distribution',
                    data: [1, 2, 3, 4, 5], 
                    backgroundColor: [
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)',
                            'rgba(75, 192, 192, 0.6)',
                            'rgba(153, 102, 255, 0.6)'
                        ],
                    borderColor: [
                        'rgba(0, 0, 0, 0.6)',
                        'rgba(0, 0, 0, 0.6)',
                        'rgba(0, 0, 0, 0.6)',
                        'rgba(0, 0, 0, 0.6)',
                        'rgba(0, 0, 0, 0.6)'
                    ],
                    borderWidth: 2
                }]
            };

            const ratingOverTimeData = {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [{
                    label: 'Average Rating Over Time',
                    data: [3.5, 4.0, 4.2, 4.5], // Hardcoded data
                    borderColor: 'red',
                    fill: false,
                    tension: 0.1
                }]
            };

            const serviceRequestsChart = new Chart(document.getElementById('serviceRequestsChart'), {
                type: 'bar',
                data: serviceRequestsData,
                options: {
                    scales: {
                        y: {
                            max: 10,
                            beginAtZero: true
                        }
                    }
                }
            });

            const ratingsChart = new Chart(document.getElementById('ratingsChart'), {
                type: 'doughnut', 
                data: ratingsData,
                options: {
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        }
                    }
                }
            });

            const ratingOverTimeChart = new Chart(document.getElementById('ratingOverTimeChart'), {
                type: 'line',
                data: ratingOverTimeData,
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 5
                        }
                    }
                }
            });
        </script>
        <div><h3>Average Rating: 4.2</h3></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
