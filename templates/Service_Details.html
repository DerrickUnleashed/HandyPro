<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Details</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('static/3.jpg'); /* Corrected background image path */
            background-size: cover; 
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            background-color: orange;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: bold;
            color: black;
        }
        .footer {
            background-color: orange;
            color: black;
        }
        .container {
            animation: fadeIn 1s ease-in-out;
            flex: 1;
        }
        .btn-primary {
            background-color: white; /* Added background color for better visibility */
            color: black; /* Added text color for better visibility */
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container mt-5 animate__animated animate__fadeInUp">
        <h1>Service Details</h1>
        {% if service %}
            <h2>{{ service[0] }}</h2>
            <p>{{ service[1] }}</p>
            <p>Price: ${{ service[2] }}</p>
        {% else %}
            <p>No service found.</p>
        {% endif %}

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
