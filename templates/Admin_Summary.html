<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Summary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <div class="container mt-5 main-content animate__animated animate__fadeInUp">
        <h1>Admin Summary</h1>
        <h2>Overall Customer Ratings</h2>
        <h5>Average Rating : 4.45</h5>
        <canvas id="customerRatingsChart"></canvas>
        <h2>Service Request Summary</h2>
        <canvas id="requestSummaryChart"></canvas>
        <h2>Average Rating Over Time</h2>
        <canvas id="ratingOverTimeChart"></canvas>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const customerRatingsData = {
            labels: ['Excellent', 'Good', 'Average', 'Fair', 'Poor'],
            datasets: [{
                label: 'Customer Ratings',
                data: [46, 30, 22, 5, 4],
                backgroundColor: [
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(153, 102, 255, 0.6)'
                    ],
                borderColor: [
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)'
                ],
                borderWidth: 2
            }]
        };

        const customerRatingsChart = new Chart(document.getElementById('customerRatingsChart'), {
            type: 'doughnut',
            data: customerRatingsData,
            options: {
                cutout: '70%',
                plugins: {
                    legend: {
                        position: 'bottom',
                    }
                }
            }
        });

        const requestSummaryData = {
            labels: ['Plumbing Repair', 'Electrical Work', 'Painting', 'Carpet Cleaning', 'Roof Repair', 'HVAC Maintenance','Landscaping', 'Window Cleaning', 'Pest Control', 'Home Inspections', 'Drywall Installation', 'Power Washing', 'House Cleaning', 'Fencing', 'Installation', 'Sewer Line Inspection', 'Moving Services', 'Gutter Cleaning', 'Concrete Work', 'Masonry', 'Bricklaying', 'Appliance Repair'],
            datasets: [{
                label: 'Service Requests',
                data: [25, 20, 30, 25, 15, 10, 15, 20, 10, 15, 20, 10, 15, 5, 10, 5, 10, 5, 10, 25, 5, 15, 5],
                backgroundColor: [
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(153, 102, 255, 0.6)'
                    ],
                borderColor: [
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)',
                    'rgba(0, 0, 0, 0.6)'
                ],
                borderWidth: 2
            }]
        };

        const requestSummaryChart = new Chart(document.getElementById('requestSummaryChart'), {
            type: 'bar',
            data: requestSummaryData,
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 50,
                        ticks: {
                            stepSize: 5
                        }
                    }
                }
            }
        });

        const ratingData = [];
        let rating = 3.5;
        for (let i = 0; i < 45; i++) {
            rating += Math.random() * 0.5 - 0.25; 
            rating = Math.max(3.2, Math.min(5, rating)); 
            ratingData.push(rating);
        }

        const ratingOverTimeChart = new Chart(document.getElementById('ratingOverTimeChart'), {
            type: 'line',
            data: {
                labels: Array.from({length: 45}, (_, i) => `Month ${i + 1}`),
                datasets: [{
                    label: 'Average Rating Over Time',
                    data: ratingData,
                    borderColor: 'red',
                    fill: false
                }]
            },
            options: {
                scales: {
                    y: {
                        min: 0,
                        max: 5
                    }
                }
            }
        });
    </script>
</body>
</html>
