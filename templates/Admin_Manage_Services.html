<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Manage Services</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="../static/styles.css">
    <style>
        /* Reset body and html margins/padding */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /* Flex layout to manage space effectively */
        body {
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1; /* Only take up the required space */
            padding-bottom: 0;
        }

        .action-buttons {
            display: flex;
            align-items: center;
        }

        .action-buttons > * {
            margin-right: 5px;
        }

        /* Table styling adjustments */
        table {
            margin-bottom: 0; /* Prevent unnecessary space below */
        }

        /* Add margin-top to first element to maintain spacing */
        .container > *:first-child {
            margin-top: 0;
        }
        .button_gap{
            margin-left: 89%;
            background-color: black;
            color: white;
            border-color: black;
            margin-bottom: 1%;
        }
    </style>
</head>
<body>
    <div class="container mt-5 animate__animated animate__fadeInUp">
        <h1>Manage Services</h1>
        <a href="/addService" class="btn button_gap btn-lg mt-3 animate__animated animate__fadeInUp">Add Service</a>
        {% if services %}
            <table class="table table-dark table-striped animate__animated animate__fadeInUp">
                <thead>
                    <tr>
                        <th>Service ID</th>
                        <th>Service Name</th>
                        <th>Base Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for service in services %}
                        <tr>
                            <td>{{ service[0] }}</td>
                            <td>{{ service[1] }}</td>
                            <td>{{ service[3] }}</td>
                            <td class="action-buttons">
                                <form method="POST" action="/Admin_Manage_Services.html">
                                    <input type="hidden" name="service_id" value="{{ service[0] }}">
                                    <input type="hidden" name="action" value="update">
                                    <button type="button" class="btn btn-warning btn-sm animate__animated animate__fadeInUp" data-bs-toggle="modal" data-bs-target="#updateModal-{{ service[0] }}">Update</button>
                                </form>
                                <form method="POST" action="/Admin_Manage_Services.html">
                                    <input type="hidden" name="service_id" value="{{ service[0] }}">
                                    <input type="hidden" name="action" value="delete">
                                    <button type="submit" class="btn btn-danger btn-sm animate__animated animate__fadeInUp" onclick="return confirm('Are you sure you want to delete this service?')">Delete</button>
                                </form>
                                <a href="/serviceDetails?service_id={{ service[0] }}" class="btn btn-info btn-sm animate__animated animate__fadeInUp">Details</a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p class="animate__animated animate__fadeInUp">No services found.</p>
        {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
