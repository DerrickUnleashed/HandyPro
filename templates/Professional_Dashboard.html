<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Homepage</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('static/3.jpg'); /* Corrected background image path */
            background-size: cover; 
            background-repeat: no-repeat; 
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        .navbar {
            background-color: black;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: bold;
            color: white;
        }
        .btn-primary{
            background-color: black;
            border-color: white;
        }
        .footer {
            background-color: black;
            color: white;
            flex-shrink: 0;
        }
        .main-content {
            flex-grow: 1;
            text-align: center;
        }
        .container {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .main-content {
            flex-grow: 1; /* Centers content vertically */
            align-items: center; /* Centers content horizontally */
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5 main-content animate__animated animate__fadeInUp">
        <h1>Professional Homepage</h1>
        <a href="/professionalServiceHistory" class="btn btn-primary btn-lg mt-3 animate__animated animate__fadeInUp">Closed Services</a>
        <a href="/professionalServiceToday" class="btn btn-primary btn-lg mt-3 animate__animated animate__fadeInUp">Today's Services</a>
        <a href="/professionalRequests" class="btn btn-primary btn-lg mt-3 animate__animated animate__fadeInUp">Service Requests</a>
        <a href="/professionalSummary" class="btn btn-primary btn-lg mt-3 animate__animated animate__fadeInUp">View Summary</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
