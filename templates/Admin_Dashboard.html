<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="../static/styles.css">
    <style>
        .main-content {
            flex-grow: 1; /* Centers content vertically */
            align-items: center; /* Centers content horizontally */
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5 main-content animate__animated animate__fadeInUp">
        <h1 class="animate__animated animate__fadeInDown">Admin Dashboard</h1>
        <a href="/adminManageServices" class="btn btn-primary btn-lg mt-3 animate__animated animate__fadeInUp">Manage Services</a>
        <a href="/adminManageProfessionals" class="btn btn-primary btn-lg mt-3 animate__animated animate__fadeInUp">Manage Professionals</a>
        <a href="/adminManageRequests" class="btn btn-primary btn-lg mt-3 animate__animated animate__fadeInUp">Manage Service Requests</a>
        <a href="/adminSummary" class="btn btn-primary btn-lg mt-3 animate__animated animate__fadeInUp">Summary</a>
        <table id="requests" class="table table-dark table-striped animate__animated animate__fadeInUp"></table>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
